name: Incident Switchboard

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      severity:
        description: "Incident severity"
        required: true
        default: low
        type: choice
        options:
          - low
          - medium
          - high

      deep_scan:
        description: "Run a deep scan"
        required: false
        default: false
        type: boolean

      skip_tests:
        description: "Skip tests"
        required: false
        default: false
        type: boolean

      reason:
        description: "Reason for the incident run"
        required: false
        type: string


run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format(
        '{0} Incident{1}',
        inputs.severity == 'low' && 'LOW' || inputs.severity == 'medium' && 'MEDIUM' || 'HIGH',
        inputs.deep_scan && ' SCAN' || ''
      )
      || format('Automatic {0}', github.event_name) }}

