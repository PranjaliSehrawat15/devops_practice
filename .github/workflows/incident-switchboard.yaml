# ==================== NEW VERSION ====================

jobs:

  triage:
    name: Triage
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.should-skip-tests.outputs.skip_tests }}
      should_scan: ${{ steps.should-scan.outputs.should_scan }}

    steps:
      - name: Print event information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Started by: ${{ github.actor }}"
          echo "Run number: ${{ github.run_number }}"

      - name: Print manual trigger details
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo ""
          echo "Severity: ${{ inputs.severity }}"
          echo "Deep scan requested: ${{ inputs.deep_scan }}"
          echo "Tests skipped: ${{ inputs.skip_tests }}"
          echo "Reason: ${{ inputs.reason }}"

      - name: Print automatic run info
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo ""
          echo "This run was automatic and no reason was supplied."

      - name: Severity - Low
        if: github.event_name == 'workflow_dispatch' && inputs.severity == 'low'
        run: echo "🟢 Low severity: Standard monitoring and initial assessment."

      - name: Severity - Medium
        if: github.event_name == 'workflow_dispatch' && inputs.severity == 'medium'
        run: echo "🟡 Medium severity: Enhanced monitoring and detailed diagnostics."

      - name: Severity - High
        if: github.event_name == 'workflow_dispatch' && inputs.severity == 'high'
        run: echo "🔴 High severity: Full investigation and escalation protocol."

      - name: Severity - Automatic
        if: github.event_name != 'workflow_dispatch'
        run: echo "⚪ Automatic run: Standard CI/CD execution."

      - name: Determine if tests should be skipped
        id: should-skip-tests
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.skip_tests }}" == "true" ]; then
            echo "skip_tests=true" >> $GITHUB_OUTPUT
          else
            echo "skip_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine if scan should run
        id: should-scan
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ inputs.deep_scan }}" == "true" ] || [ "${{ inputs.severity }}" == "high" ]; then
              echo "should_scan=true" >> $GITHUB_OUTPUT
            else
              echo "should_scan=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_scan=false" >> $GITHUB_OUTPUT
          fi


  tests:
    name: Tests
    needs: triage
    runs-on: ubuntu-latest
    if: needs.triage.outputs.skip_tests != 'true'
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test -- --coverage --watchAll=false --passWithNoTests


  scan:
    name: Scan
    needs: triage
    runs-on: ubuntu-latest
    if: needs.triage.outputs.should_scan == 'true'

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Create scan.json
        run: |
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          
          cat > scan.json << EOF
          {
            "severity": "${{ inputs.severity }}",
            "deepScan": ${{ inputs.deep_scan || 'false' }},
            "actor": "${{ github.actor }}",
            "runNumber": ${{ github.run_number }},
            "timeUtc": "${BUILD_TIME}"
          }
          EOF
          
          cat scan.json

      - name: Read and verify scan.json with jq
        run: |
          echo ""
          echo "Reading values from scan.json:"
          echo "Severity: $(jq -r '.severity' scan.json)"
          echo "Actor: $(jq -r '.actor' scan.json)"


  report:
    name: Report
    needs: [triage, tests, scan]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Report job statuses
        run: |
          echo "=== Execution Report ==="
          echo ""
          
          # Determine tests status
          if [ "${{ needs.triage.outputs.skip_tests }}" == "true" ]; then
            TESTS_STATUS="skipped"
            TESTS_DISPLAY="Tests: ⏭️  skipped"
          elif [ "${{ needs.tests.result }}" == "success" ]; then
            TESTS_STATUS="success"
            TESTS_DISPLAY="Tests: ✅ succeeded"
          elif [ "${{ needs.tests.result }}" == "failure" ]; then
            TESTS_STATUS="failure"
            TESTS_DISPLAY="Tests: ❌ failed"
          else
            TESTS_STATUS="skipped"
            TESTS_DISPLAY="Tests: ⏭️  skipped"
          fi
          
          # Determine scan status
          if [ "${{ needs.triage.outputs.should_scan }}" != "true" ]; then
            SCAN_STATUS="skipped"
            SCAN_DISPLAY="Scan: ⏭️  skipped"
          elif [ "${{ needs.scan.result }}" == "success" ]; then
            SCAN_STATUS="success"
            SCAN_DISPLAY="Scan: ✅ succeeded"
          elif [ "${{ needs.scan.result }}" == "failure" ]; then
            SCAN_STATUS="failure"
            SCAN_DISPLAY="Scan: ❌ failed"
          else
            SCAN_STATUS="skipped"
            SCAN_DISPLAY="Scan: ⏭️  skipped"
          fi
          
          echo "${TESTS_DISPLAY}"
          echo "${SCAN_DISPLAY}"
          echo ""
          echo "=== Summary ==="
          
          # Summary based on results
          if [ "$TESTS_STATUS" == "failure" ] || [ "$SCAN_STATUS" == "failure" ]; then
            echo "⚠️  One or more jobs failed. Immediate attention required."
          else
            echo "✅ All jobs that ran completed successfully."
          fi

      - name: Close switchboard
        run: echo "Switchboard closed"

# ==================== END NEW VERSION ====================