name: Nightly Housekeeper

on:
    schedule:
        - cron: '0 2 * * *'
    workflow_dispatch:
jobs: 
    cleanup:
        runs-on: ubuntu-latest
        steps:
            - name: Prints current date and time
              run: |
                echo "Current date and time(UTC): $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            - name: Running nightly cleanup
              run: |
                echo "Running nightly cleanup"
            - name: Finish
              run: echo "Housekeeping complete"