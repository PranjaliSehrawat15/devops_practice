name: Pipeline Archive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - full
      skip_cache:
        description: 'Skip cache'
        required: false
        type: boolean
        default: false

env:
  APP_NAME: "react-app"

jobs:

  test-build:
    name: Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./react-app
    outputs:
      build_ran: ${{ steps.build-check.outputs.build_ran }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node_modules (when skip_cache is false)
        id: cache
        if: github.event_name != 'workflow_dispatch' || inputs.skip_cache != true
        uses: actions/cache@v3
        with:
          path: react-app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage --watchAll=false --passWithNoTests 2>&1 || true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-coverage-${{ github.run_number }}
          path: react-app/coverage/
          retention-days: ${{ fromJson(vars.RETENTION_DAYS) || 30 }}

      - name: Determine if build should run
        id: build-check
        run: |
          BUILD_MODE="${{ github.event_name == 'workflow_dispatch' && inputs.build_mode || 'n/a' }}"
          EVENT="${{ github.event_name }}"
          
          if [ "$EVENT" == "push" ] || [ "$BUILD_MODE" == "full" ]; then
            echo "build_ran=true" >> $GITHUB_OUTPUT
          else
            echo "build_ran=false" >> $GITHUB_OUTPUT
          fi

      - name: Build app (full mode or push to main)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_mode == 'full')
        run: npm run build

      - name: Build skipped message
        if: github.event_name == 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_mode == 'quick')
        run: |
          echo "⏭️  Build skipped: Quick mode on pull request - not building to save time"

      - name: Upload build artifact
        if: steps.build-check.outputs.build_ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-build-${{ github.sha }}
          path: react-app/build/
          retention-days: ${{ fromJson(vars.RETENTION_DAYS) || 30 }}

      - name: Print summary
        run: |
          BUILD_MODE="${{ github.event_name == 'workflow_dispatch' && inputs.build_mode || format('n/a — {0}', github.event_name) }}"
          CACHE_USED="${{ steps.cache.outputs.cache-hit == 'true' && 'yes' || 'no' }}"
          echo "${{ format('App: {0} | Mode: {1} | Cache: {2}', env.APP_NAME, BUILD_MODE, CACHE_USED) }}"


  verify-archive:
    name: Verify Archive
    needs: test-build
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-coverage-${{ github.run_number }}
          path: ./artifacts/coverage

      - name: Download build artifact
        if: needs.test-build.outputs.build_ran == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-build-${{ github.sha }}
          path: ./artifacts/build

      - name: Skip build artifact download
        if: needs.test-build.outputs.build_ran != 'true'
        run: |
          echo "⏭️  Build artifact download skipped: No build was generated"

      - name: Print artifact structure
        run: |
          echo "=== Artifact Structure ==="
          tree artifacts -L 2 2>/dev/null || find artifacts -type f -o -type d | head -20

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Create archive manifest
        run: |
          BUILD_PRESENT="${{ needs.test-build.outputs.build_ran == 'true' && 'true' || 'false' }}"
          RETENTION="${{ vars.RETENTION_DAYS || 30 }}"
          
          cat > archive-manifest.json << EOF
          {
            "appName": "${{ env.APP_NAME }}",
            "runNumber": ${{ github.run_number }},
            "retentionDays": $RETENTION,
            "buildArtifactPresent": $BUILD_PRESENT,
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          
          cat archive-manifest.json

      - name: Verify manifest with jq
        run: |
          echo ""
          echo "App name from manifest: $(jq -r '.appName' archive-manifest.json)"

      - name: Archive verified
        run: |
          echo ""
          echo "✅ Archive verified"
