name: On-Call Assistant

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: write

env:
  APP_NAME: "node-service"

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint


  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test


  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build


  analyze:
    name: Analyze
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Analyze failed jobs
        id: analyze
        run: |
          echo "=== SenseTheLog Analysis ==="
          echo ""
          
          # Simulate error signature generation
          SIGNATURE="ERR-$(date +%s)-$(shuf -i 1000-9999 -n 1)"
          echo "error_signature=${SIGNATURE}" >> $GITHUB_OUTPUT
          echo "is_recurring=false" >> $GITHUB_OUTPUT
          
          echo "Error Signature: ${SIGNATURE}"
          echo "Is Recurring: false"
          echo ""
          echo "Analyzing failure root cause from job logs..."
          
          if [ "${{ needs.lint.result }}" == "failure" ]; then
            echo "- Lint job failed"
          fi
          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "- Test job failed"
          fi
          if [ "${{ needs.build.result }}" == "failure" ]; then
            echo "- Build job failed"
          fi

      - name: Print analysis results
        run: |
          echo ""
          echo "Error Signature: ${{ steps.analyze.outputs.error_signature }}"
          echo "Is Recurring: ${{ steps.analyze.outputs.is_recurring }}"


  notify-on-recurrence:
    name: Notify on Recurrence
    needs: analyze
    runs-on: ubuntu-latest
    if: needs.analyze.outputs.is_recurring == 'true'

    steps:
      - name: Recurrence detected
        run: |
          echo "⚠️  This exact failure has occurred before and should be treated as a priority fix rather than re-run and forgotten."
