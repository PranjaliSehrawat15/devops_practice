name: Release Watcher

on:
    # push:
    #   branches:
    #     - main
    # schedule:
    #     - cron: '0 9 * * MON'
    workflow_dispatch:

jobs:
    watch:
      runs-on: ubuntu-latest
      steps:
            - name: Event name that triggers the run
              run: |
                echo "Trigger-type: ${{github.event_name}}"
            - name: Current date and time(UTC)
              run: |
                echo "Current date and time(UTC): $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            - name: Finish
              run: echo "Release watch complete"